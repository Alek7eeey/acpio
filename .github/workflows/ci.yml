# The gate every commit and every pull request goes through.
#
#   push (any branch)   →  typecheck → build → test → test:e2e
#   pull_request        →  the same four checks
#
# Nothing here publishes: `release.yml` owns npm and the GitHub Release, and a
# pipeline that went red must not be able to publish anything, so this workflow
# only reads.
#
# The four checks, in the order they run:
#
#   typecheck  `tsc -p tsconfig.typecheck.json` — every workspace's sources
#              compiled together with noEmit. The config resolves the workspace
#              packages to their sources, so this needs no prior build: a fresh
#              clone tells a type error apart from a packaging problem.
#   build      `npm run build` — the real thing: tsc declarations per package,
#              the server's JS, the web bundle (vite) and its service worker.
#   test       `npm test` — vitest over the whole pyramid (unit, server
#              integration against an in-memory schema, jsdom components).
#   test:e2e   `npm run test:e2e` — Playwright against the build from the step
#              above: a real server, a real ACP agent process (the deterministic
#              fake from apps/server/test), three layouts (1440×900, Pixel 7,
#              iPhone SE). It runs in this job on purpose: `ci` is the required
#              status check, so an e2e failure has to turn the same check red.
#              On failure the trace and screenshot of each broken spec are
#              uploaded as an artifact — `npx playwright show-trace` reads a
#              trace offline.
#
# Merging before the pipeline is green is refused by branch protection, not by
# this file: the repository settings require the `ci` job as a status check on
# the protected branch. That setting lives outside the repository — write it
# once from a machine with an admin token:
#
#   GITHUB_TOKEN=… npm run ci:protect
#
# (scripts/setup-branch-protection.mjs, idempotent, leaves other rules alone).
#
# Note for `ci` being a required check: the job id is the check name GitHub
# shows and branch protection matches, so renaming `ci` silently unpins the
# rule — rename it in both places or neither.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push to the same branch makes the previous run pointless — GitHub keeps
# paying for it otherwise, and a stale red check would stay on the PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # Full history and the tags, because the build stamps the release it came
      # from: `scripts/generate-version.mjs` reads the `v*.*.*` tags, and a
      # depth-1 clone carries none — every CI build would then call itself
      # 0.1.0 (the `package.json` base, not v0.1.42), see npm's newer release,
      # and open the update popup over the shell the e2e suite drives. The
      # release build fetches the same way for the same reason.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Matches the lockfile's engines (>=20) and what the release builds on.
          node-version: 22
          cache: npm

      # `npm ci` (not `install`): the lockfile decides, and a lock out of sync
      # with package.json fails here instead of drifting between machines.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # One engine for every layout: the suite's projects change viewport and
      # touch, not browser, so Chromium alone is enough.
      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Test (e2e)
        run: npm run test:e2e

      - name: Upload what the e2e run left behind
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: tmp/e2e/artifacts
          if-no-files-found: ignore
          retention-days: 7
