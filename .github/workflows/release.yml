# Publishes the npm package `acpio`.
#
# Two ways in:
#
#   git tag v0.1.39 && git push origin v0.1.39      # a release
#   Actions → release → Run workflow                # a manual run (this file's
#                                                   # workflow_dispatch inputs)
#
# A tag release takes the version from git history (scripts/versionHistory.mjs,
# the number stamped into VERSIONS.md) and refuses to continue unless the tag
# equals it, so what npm serves can never disagree with the number the app
# itself reports.
#
# A manual run has no tag to match: with no input it packs the version of the
# checked-out revision and stops there. `dry_run: false` publishes that version
# (which is a no-op if it is already on npm), and `prerelease: true` publishes
# `<version>-rc.<run number>` under the `next` dist-tag instead. That last one is
# the way to verify a build on the registry — and to validate a trusted
# publishing configuration — without claiming the release number itself.
#
# Authentication is npm trusted publishing (OIDC): no secret, no one-time
# password. The package's Settings → Trusted publishing names this repo and
# `release.yml`, and the id-token permission below is what the exchange uses.
# npm only allows that exchange from npm 11.5.1 on, so the publish step upgrades
# the CLI first — `npm ci` above stays on the runner's own npm.
#
# A token cannot replace it: npm now demands a one-time password for direct
# publishing with credentials (and is retiring 2FA-bypassing tokens in 2027), and
# a CI job has no authenticator. Do not add NODE_AUTH_TOKEN back.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only build the package, publish nothing (ignored when prerelease is on)"
        type: boolean
        default: true
      prerelease:
        description: "Publish <version>-rc.<run> under the `next` dist-tag (publishes even with dry_run on)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version comes from the whole history — a shallow clone would
          # derive a smaller patch number and fail the tag check.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Pack (a tag must match the version git derives)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            npm run pack:npm -- --expect-tag "$GITHUB_REF_NAME"
          elif [ "${{ inputs.prerelease }}" = "true" ]; then
            npm run pack:npm -- --version-suffix "-rc.${{ github.run_number }}"
          else
            npm run pack:npm
          fi

      - name: Publish (trusted publishing)
        if: github.event_name == 'push' || inputs.prerelease == true || inputs.dry_run == false
        run: |
          spec=$(node -p "const p = require('./dist-npm/package.json'); p.name + '@' + p.version")
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already on npm — nothing to publish."
            exit 0
          fi
          npm install -g npm@latest
          tag=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            tag="--tag next"
          fi
          npm publish ./dist-npm --provenance --access public $tag
