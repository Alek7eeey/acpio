# Publishes the npm package `acpio` and cuts a GitHub Release for it.
#
# Two ways in:
#
#   git tag v0.1.39 && git push origin v0.1.39   # a release from a tag you made
#   Actions → release → Run workflow             # the same from the UI: this
#                                                # workflow publishes and pushes
#                                                # the tag itself
#
# The version is never an input — it is a function of the release tags
# (scripts/releaseTags.mjs: one patch above the highest tag reachable, or the tag
# itself on a tagged revision). A tag release refuses to continue unless its tag
# equals that number; a manual run publishes exactly what the checkout derives, and
# then pushes the tag that makes it a release. So what npm serves cannot disagree
# with the number the app itself reports, whichever door was used.
#
# The tag a manual run pushes goes out with GITHUB_TOKEN, and events caused by
# that token do not start workflows — so tagging here cannot re-trigger this
# workflow and publish twice.
#
# Authentication is npm trusted publishing (OIDC): no secret, no one-time
# password. The package's Settings → Trusted publishing names this repo and
# `release.yml`, and the id-token permission below is what the exchange uses.
# npm only allows that exchange from npm 11.5.1 on, so the publish step upgrades
# the CLI first — `npm ci` above stays on the runner's own npm.
#
# A token cannot replace it: npm now demands a one-time password for direct
# publishing with credentials (and is retiring 2FA-bypassing tokens in 2027), and
# a CI job has no authenticator. Do not add NODE_AUTH_TOKEN back.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the derived version to npm, tag it and write the GitHub Release (off = only build the package)"
        type: boolean
        default: false
      notes:
        description: "What changed — the GitHub Release body (empty = the tagged message, else the commits)"
        type: string
        required: false

permissions:
  contents: write # push the release tag and write the GitHub Release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Both the version and the notes are functions of the whole history —
          # a shallow clone would derive a smaller patch number and fail the tag
          # check.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Pack (a tag must match the version git derives)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            npm run pack:npm -- --expect-tag "$GITHUB_REF_NAME"
          else
            npm run pack:npm
          fi

      - name: Publish (trusted publishing)
        id: publish
        if: github.event_name == 'push' || inputs.publish == true
        run: |
          echo "published=false" >> "$GITHUB_OUTPUT"
          spec=$(node -p "const p = require('./dist-npm/package.json'); p.name + '@' + p.version")
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already on npm — nothing to publish, nothing to release."
            exit 0
          fi
          npm install -g npm@latest
          npm publish ./dist-npm --provenance --access public
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Tag the release
        if: steps.publish.outputs.published == 'true'
        run: |
          version=$(node -p "require('./dist-npm/package.json').version")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already exists — left as it is."
            exit 0
          fi
          git tag "v$version"
          git push origin "v$version"

      - name: Release notes
        if: steps.publish.outputs.published == 'true'
        run: |
          version=$(node -p "require('./dist-npm/package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            node scripts/release-notes.mjs --version "$version" > notes.md
          else
            node scripts/release-notes.mjs --version "$version" --extra "${{ inputs.notes }}" > notes.md
          fi
          cat notes.md

      - name: GitHub Release
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./dist-npm/package.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release edit "v$version" --notes-file notes.md
          else
            gh release create "v$version" --title "acpio $version" --notes-file notes.md
          fi
