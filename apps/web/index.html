<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <script>
      // The palette lives in CSS under [data-theme="dark"], and the app's own
      // applyTheme runs only once the bundle does — until then the document
      // paints the light :root values, so a dark-theme reader is left on a blank
      // #f7f8fa page whenever the bundle is slow or a service-worker reload
      // catches the server restarting. Same rule as lib/store.ts, one paint earlier.
      try {
        document.documentElement.setAttribute(
          "data-theme",
          localStorage.getItem("acpio.theme") === "dark" ? "dark" : "light",
        );
      } catch {}
    </script>
    <meta name="theme-color" content="#0866ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Acpio" />
    <meta name="application-name" content="Acpio" />
    <meta name="description" content="Self-hosted harness for ACP agents" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Acpio</title>
    <script>
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__acpDeferredInstall = e;
      });
      window.addEventListener("appinstalled", function () {
        window.__acpDeferredInstall = null;
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
